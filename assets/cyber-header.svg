<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Shahd Aboelmakarm — Computer Engineer</title>
  <desc id="desc">Animated cyberpunk profile wallpaper with a GitHub icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset=".52" stop-color="#101B36"/>
      <stop offset="1" stop-color="#00F5D4"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4ECD" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#7C3AED" stop-opacity=".2"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity=".55"/>
      <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0H8" stroke="#fff" stroke-opacity=".08"/>
    </pattern>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#00F5D4" stroke-opacity=".2"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="240" rx="14" fill="url(#bg)"/>
  <rect width="900" height="240" rx="14" fill="url(#aurora)" opacity=".8"/>
  <rect x="0" y="130" width="900" height="110" fill="url(#grid)" opacity=".65" transform="perspective(500px) rotateX(42deg)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 36" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g fill="#F8FAFC">
    <circle cx="90" cy="28" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="35" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="24" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="55" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="150" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M0 195 C180 125 265 225 430 175 S700 135 900 180 V240 H0Z" fill="#070A12" opacity=".78"/>
  <path d="M0 195 C180 125 265 225 430 175 S700 135 900 180" fill="none" stroke="#00F5D4" stroke-opacity=".55" stroke-width="2" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="3s" repeatCount="indefinite"/>
  </path>
  <rect width="900" height="240" rx="14" fill="url(#scanlines)">
    <animate attributeName="y" from="-8" to="8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <path d="M18 48V18H48M852 18h30v30M18 192v30h30M882 192v30h-30" fill="none" stroke="#FF4ECD" stroke-width="2"/>
  <g fill="none" stroke-width="2" opacity=".8">
    <path d="M18 82h88l16-16h38" stroke="#FF4ECD" stroke-dasharray="5 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M882 94h-72l-18 18h-32" stroke="#00F5D4" stroke-dasharray="5 8">
      <animate attributeName="stroke-dashoffset" from="0" to="52" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(52 72)" filter="url(#glow)" fill="none" stroke="#00F5D4" stroke-width="4">
    <circle cx="40" cy="40" r="34"/>
    <circle cx="40" cy="40" r="42" stroke="#FF4ECD" stroke-opacity=".5" stroke-dasharray="3 12">
      <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="8s" repeatCount="indefinite"/>
    </circle>
    <path d="M19 48c7 12 35 12 42 0M26 33h1M53 33h1M28 66l-8 12M52 66l8 12"/>
  </g>
  <text x="153" y="100" fill="#FF4ECD" opacity=".65" font-family="Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="3">SHAHD ABOELMAKARM
    <animate attributeName="x" values="153;150;153" dur="2.8s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="100" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="3">SHAHD ABOELMAKARM
    <animate attributeName="opacity" values="1;1;.75;1" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text x="153" y="137" fill="#FF4ECD" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">COMPUTER ENGINEER // DATA &amp; SOFTWARE BUILDER</text>
  <text x="153" y="169" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="14">Building useful systems from data, clean code, and thoughtful engineering.</text>
  <text x="153" y="202" fill="#00F5D4" font-family="monospace" font-size="11" letter-spacing="2">[ SYSTEM STATUS: ONLINE // PROFILE WALLPAPER ACTIVE ]</text>
</svg>
